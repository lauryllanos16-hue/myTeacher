<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myTeacher - Mis Reservas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/Styles/Estudiante/mis_reservas.css">
  <link rel="stylesheet" href="/Styles/global.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav>
  <div class="logo-slot">
    <img src="/Imagenes/Logo.png" alt="myTeacher logo">
  </div>

  <!-- Links centrados -->
<div class="nav-links" id="navLinks">
    <a href="inicio_estudiante.html">Buscar</a>
    <a href="#"class = "active">Mis reservas</a>
    <a href="perfil.html#tutorias">Historial</a>
    <a href="perfil.html">Perfil</a>
    <!-- Solo visible en móvil dentro del menú -->
    <button class="btn-cerrar-sesion-mobile" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <!-- Desktop: cerrar sesión + campana a la derecha -->
  <div class="nav-right">
    <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
    <div class="nav-bell" id="bell">🔔</div>
    <div class="notif-panel" id="notifPanel">
      <p>Recordatorio que tiene una clase en 20 minutos</p>
    </div>
  </div>

  <!-- Hamburguesa solo móvil -->
  <button class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>
  <div class="page">

    <!-- TÍTULO SECCIÓN -->
    <div class="section-label">
      <span>&#127891; Mis reservas</span>
    </div>

    <!-- CONTENEDOR DE RESERVAS -->
    <div id="reservasContainer"></div>

    <!-- VER MÁS -->
    <div class="ver-mas-wrap">
      <button class="btn-ver-mas" id="btnVerMas" onclick="verMas()">Ver más</button>
    </div>

  </div>

  <!-- MODAL CANCELAR -->
  <div class="modal-overlay" id="modalCancelar">
    <div class="modal">
      <div class="modal-icon cancel">&#33;</div>
      <h3>¿Cancelar reserva?</h3>
      <p id="modalCancelarDetalle"></p>
      <div class="modal-btns">
        <button class="btn-modal-no" onclick="cerrarModalCancelar()">No, volver</button>
        <button class="btn-modal-si" onclick="confirmarCancelar()">Sí, cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL UNIRSE -->
  <div class="modal-overlay" id="modalUnirse">
    <div class="modal">
      <div class="modal-icon join">&#9654;</div>
      <h3>Unirse a la clase</h3>
      <p id="modalUnirseDetalle"></p>
      <div class="modal-btns">
        <button class="btn-modal-no" onclick="cerrarModalUnirse()">Cancelar</button>
        <button class="btn-modal-si" onclick="abrirEnlace()">Unirse ahora</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="/Imagenes/logo letras blancas.png" alt="myTeacher logo">
      </div>
      <div class="footer-cols">
        <div class="footer-col">
          <h4>Contactos</h4>
          <p>
            Numero: +57 302 xxxx xxx<br>
            Correo: soporte@unilibre.edu
          </p>
        </div>
        <div class="footer-col">
          <h4>Síguenos</h4>
         <div class="social-icons">
      <a href="#" class="social-icon si-fb" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
        <a href="#" class="social-icon si-ig" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
        <a href="#" class="social-icon si-x" aria-label="X">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="white">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-copy">&#169; 2025 myTeacher - Todos los derechos reservados</div>
  </footer>

  <script src="/Scripts/Estudiante/mis_reservas.js"></script>
  <script src="/Scripts/global.js"></script>
</body>
</html>
